problem: 'blasius'

implicit: true
ts:
  adapt_type: 'none'
  type: 'beuler'
  time_step: 2e-6
  max_steps: 5

dm_plex_box_faces: 3,20,1
meshtransform:
  type: platemesh
  platemesh:
    Ndelta: 15
    growth: 1.3

stab: 'supg'

dm_plex_box_lower: 0,0,0
dm_plex_box_upper: 4.2e-3,4.2e-3,5.e-4
dm_plex_dim: 3
# Faces labeled 1=z- 2=z+ 3=y- 4=y+ 5=x+ 6=x-
bc_names: symmetry,wall,inflow,outflow
bc_symmetry:
  face_ids: 1,2
  essential_comps: 3
bc_wall:
  face_ids: 3
  essential_comps: 1,2,3
  is_viscous_wall:
bc_inflow:
  face_ids: 6
  natural_type: stg-weak
bc_outflow:
  face_ids: 5,4
  natural_type: outflow
  outflow_type: pressure

stg:
  use: true
  inflow_path: "examples/STGInflow_blasius.dat"
  rand_path: "examples/STGRand.dat"
  mean_only: false
