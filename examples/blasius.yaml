problem: 'blasius'

implicit: true
ts:
  adapt_type: 'none'
  type: 'beuler'
  time_step: 2e-6
  max_time: 1.0e-3
  #monitor_solution: cgns:blasius-%d.cgns
  #monitor_solution_interval: 10
checkpoint_interval: 10

## Linear Settings:
degree: 1
dm_plex_box_faces: 40,60,1
meshtransform:
  type: platemesh
  platemesh:
    Ndelta: 45
    growth: 1.08

# # Quadratic Settings:
# degree: 2
# dm_plex_box_faces: 20,30,1
# meshtransform:
#   type: platemesh
#   platemesh:
#     Ndelta: 22
#     growth: 1.1664 # 1.08^2

stab: 'supg'

dm_plex_box_lower: 0,0,0
dm_plex_box_upper: 4.2e-3,4.2e-3,5.e-5
dm_plex_dim: 3
gravity: 0,0,0
# Faces labeled 1=z- 2=z+ 3=y- 4=y+ 5=x+ 6=x-
bc_names: symmetry,wall,inflow,outflow
bc_symmetry:
  face_ids: 1,2
  essential_comps: 3
bc_wall:
  face_ids: 3
  essential_comps: 1,2,3
  is_viscous_wall:
bc_inflow:
  face_ids: 6
  natural_type: blasius-inflow
bc_outflow:
  face_ids: 5,4
  natural_type: outflow

